<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V8 - Cloud CMS</title>

<link rel="stylesheet" href="style.css">

<style>
body { padding:20px; font-family:Arial; }

.bar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:16px;
}

.card {
  border:1px solid var(--border);
  padding:14px;
  border-radius:14px;
  background: rgba(255,255,255,0.05);
}

.item {
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--border);
  cursor:pointer;
}
</style>

</head>

<body>

<h1>☁ Admin V8 - Cloud CMS</h1>

<div class="bar">
  <button onclick="mode='songs'; render()">🎵 Songs</button>
  <button onclick="mode='news'; render()">📰 News</button>

  <button onclick="saveSnapshot()">📸 Snapshot</button>
  <button onclick="undo()">↩ Undo</button>

  <button onclick="exportAll()">⬇ Full Export</button>
  <button onclick="importFile()">⬆ Import</button>

  <button onclick="pushToGitHub()">🚀 Push Live</button>
</div>

<div class="container">

<div class="card">
<h2>📦 Content</h2>
<div id="list"></div>
</div>

<div class="card">
<h2>👁 Preview</h2>
<div id="preview"></div>
</div>

</div>

<input type="file" id="fileInput" style="display:none">

<script>

let mode = "songs";

let songs = [];
let news = [];

let history = [];

// INIT
Promise.all([
  fetch("songs.json").then(r => r.json()),
  fetch("news.json").then(r => r.json())
]).then(([s,n]) => {
  songs = s.songs || [];
  news = n.news || [];
  render();
});

// DATA
function getData() {
  return mode === "songs" ? songs : news;
}

// RENDER
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  getData().forEach((item,i) => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <small>${item.album || item.date || ""}</small>
    `;

    div.onclick = () => {
      document.getElementById("preview").innerHTML = `
        <h3>${item.title}</h3>
        <p>${item.album || item.date || ""}</p>
      `;
    };

    list.appendChild(div);
  });

  saveLocal();
}

// SNAPSHOT
function saveSnapshot() {
  history.push(JSON.stringify({ songs, news }));
  alert("Snapshot gespeichert");
}

// UNDO
function undo() {
  if(!history.length) return;
  const last = JSON.parse(history.pop());
  songs = last.songs || songs;
  news = last.news || news;
  render();
}

// LOCAL SAVE
function saveLocal() {
  localStorage.setItem("v8_cms", JSON.stringify({ songs, news }));
}

// EXPORT ALL
function exportAll() {
  const blob = new Blob(
    [JSON.stringify({ songs, news }, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "full_backup.json";
  a.click();
}

// IMPORT
function importFile() {
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", e => {
  const reader = new FileReader();

  reader.onload = ev => {
    const data = JSON.parse(ev.target.result);
    songs = data.songs || [];
    news = data.news || [];
    render();
  };

  reader.readAsText(e.target.files[0]);
});

// 🚀 GITHUB PUSH (CORE)
async function pushToGitHub() {

  const token = "YOUR_GITHUB_TOKEN";
  const repo = "eselhans/eselhans.github.io";

  const files = [
    { path: "songs.json", content: songs },
    { path: "news.json", content: news }
  ];

  for(const file of files) {

    await fetch(`https://api.github.com/repos/${repo}/contents/${file.path}`, {
      method: "PUT",
      headers: {
        "Authorization": `token ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "CMS Update",
        content: btoa(JSON.stringify(file.content, null, 2)),
        sha: await getSHA(repo, file.path, token)
      })
    });

  }

  alert("🚀 Push complete");
}

// GET SHA (required for GitHub update)
async function getSHA(repo, path, token) {

  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    headers: { Authorization: `token ${token}` }
  });

  const data = await res.json();
  return data.sha;
}

</script>

</body>
</html>
