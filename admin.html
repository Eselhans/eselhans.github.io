<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V7 - CMS Engine</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  padding: 20px;
  font-family: Arial;
}

.bar {
  display:flex;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.bar button {
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:16px;
}

.card {
  border:1px solid var(--border);
  padding:14px;
  border-radius:14px;
  background: rgba(255,255,255,0.05);
}

.item {
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background: rgba(0,0,0,0.2);
  cursor:pointer;
}

.small {
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<h1>🎛 Admin V7 CMS Engine</h1>

<div class="bar">
  <button onclick="mode='songs'; render()">🎵 Songs</button>
  <button onclick="mode='news'; render()">📰 News</button>

  <button onclick="saveSnapshot()">📸 Snapshot</button>
  <button onclick="undo()">↩ Undo</button>

  <button onclick="exportJSON()">⬇ Export</button>
  <button onclick="importJSON()">⬆ Import</button>
</div>

<div class="container">

<!-- LIST -->
<div class="card">
<h2>📦 Content</h2>
<div id="list"></div>
</div>

<!-- PREVIEW -->
<div class="card">
<h2>👁 Preview</h2>
<div id="preview"></div>
</div>

</div>

<input type="file" id="fileInput" style="display:none" />

<script>

let mode = "songs";

let songs = [];
let news = [];

let history = [];

// LOAD
Promise.all([
  fetch("songs.json").then(r => r.json()),
  fetch("news.json").then(r => r.json())
]).then(([s, n]) => {

  songs = s.songs || [];
  news = n.news || [];

  loadLocal();
  render();
});

// GET DATA
function getData() {
  return mode === "songs" ? songs : news;
}

// RENDER
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  const data = getData();

  data.forEach((item, i) => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <span class="small">${item.album || item.date || ""}</span>
    `;

    div.onclick = () => {
      document.getElementById("preview").innerHTML = `
        <h3>${item.title}</h3>
        <p>${item.album || item.date || ""}</p>
      `;
    };

    list.appendChild(div);
  });

  saveLocal();
}

// SNAPSHOT (VERSION SYSTEM)
function saveSnapshot() {
  history.push(JSON.stringify({ songs, news }));
  alert("Snapshot gespeichert");
}

// UNDO
function undo() {
  if(history.length === 0) return;

  const last = JSON.parse(history.pop());
  songs = last.songs || songs;
  news = last.news || news;

  render();
}

// LOCAL SAVE
function saveLocal() {
  localStorage.setItem("cms_v7", JSON.stringify({ songs, news }));
}

// LOCAL LOAD
function loadLocal() {
  const data = localStorage.getItem("cms_v7");
  if(data) {
    const parsed = JSON.parse(data);
    songs = parsed.songs || songs;
    news = parsed.news || news;
  }
}

// EXPORT
function exportJSON() {

  const data = { songs, news };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cms_backup.json";
  a.click();
}

// IMPORT
function importJSON() {
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", e => {

  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(evt) {
    const data = JSON.parse(evt.target.result);

    songs = data.songs || [];
    news = data.news || [];

    render();
  };

  reader.readAsText(file);
});

</script>

</body>
</html>
