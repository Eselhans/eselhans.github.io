<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Multi Dashboard | Eselhans</title>

<style>
body {
  font-family: Arial;
  background:#0b0b10;
  color:#f4f1ea;
  padding:30px;
}

h1 { margin-bottom: 20px; }

select, input, textarea {
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:#fff;
}

button {
  padding:12px 16px;
  border-radius:12px;
  border:0;
  background:#c98b4f;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.card {
  background:#15151d;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

.preview {
  white-space: pre-wrap;
  font-size: 0.85rem;
  color: #b9b0a6;
}
</style>
</head>

<body>

<h1>🧠 Multi Dashboard v1</h1>

<div class="card">

  <label>Kategorie wählen</label>
  <select id="type" onchange="switchForm()">
    <option value="news">📰 News</option>
    <option value="songs">🎵 Songs</option>
    <option value="lyrics">📝 Lyrics</option>
  </select>

  <input id="title" placeholder="Titel">
  <input id="date" placeholder="Datum (YYYY-MM-DD)">

  <input id="image" placeholder="Bild (optional - für News/Songs)">

  <textarea id="text" placeholder="Text / Lyrics"></textarea>

  <button onclick="addItem()">➕ Hinzufügen</button>
  <button onclick="downloadJSON()">⬇ JSON Download</button>

</div>

<div class="card">
  <h2>📦 JSON Vorschau</h2>
  <pre id="output" class="preview"></pre>
</div>

<script>

let database = {
  news: [],
  songs: [],
  lyrics: []
};

function switchForm() {
  const type = document.getElementById("type").value;

  document.getElementById("image").style.display =
    (type === "lyrics") ? "none" : "block";
}

function addItem() {

  const type = document.getElementById("type").value;

  let item = {
    title: document.getElementById("title").value,
    date: document.getElementById("date").value,
    text: document.getElementById("text").value
  };

  if (type !== "lyrics") {
    item.image = document.getElementById("image").value;
  }

  database[type].push(item);

  updatePreview();
}

function updatePreview() {
  document.getElementById("output").innerText =
    JSON.stringify(database, null, 2);
}

function downloadJSON() {

  const type = document.getElementById("type").value;

  const blob = new Blob(
    [JSON.stringify(database[type], null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = type + ".json";
  a.click();
}

switchForm();

</script>

</body>
</html>
