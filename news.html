
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>News</h1>
<div id="out"></div>
</div>

<script>
fetch('news.json')
.then(r=>r.json())
.then(d=>{
d.sort((a,b)=>new Date(b.date)-new Date(a.date));
let out=document.getElementById('out');
d.forEach(n=>{
out.innerHTML += `<div class="card"><h2>${n.title}</h2><p>${n.date}</p><p>${n.text}</p></div>`;
});
});
</script>
</body>
</html>
