<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Multi Dashboard PRO | Eselhans</title>

<style>
body {
  font-family: Arial;
  background:#0b0b10;
  color:#f4f1ea;
  padding:30px;
}

h1 { margin-bottom: 20px; }

select, input, textarea {
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:#fff;
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:0;
  background:#c98b4f;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.card {
  background:#15151d;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

.item {
  padding:10px;
  margin-top:10px;
  border:1px solid #333;
  border-radius:10px;
  background:#111;
}

.row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.small {
  font-size: 0.8rem;
  color:#b9b0a6;
}

.preview {
  border-left:3px solid #c98b4f;
  padding-left:10px;
}
</style>
</head>

<body>

<h1>🧠 Dashboard PRO</h1>

<div class="card">

  <label>Kategorie</label>
  <select id="type" onchange="render()">
    <option value="news">📰 News</option>
    <option value="songs">🎵 Songs</option>
    <option value="lyrics">📝 Lyrics</option>
  </select>

  <input id="title" placeholder="Titel">
  <input id="date" placeholder="Datum">
  <input id="image" placeholder="Bild (optional)">
  <textarea id="text" placeholder="Text / Lyrics"></textarea>

  <button onclick="addItem()">➕ Add / Update</button>
</div>

<div class="card">
  <h2>📦 Liste</h2>
  <div id="list"></div>
</div>

<div class="card">
  <h2>👁 Live Preview</h2>
  <div id="preview" class="preview"></div>
</div>

<div class="card">
  <h2>⬇ Export</h2>
  <button onclick="download()">JSON Download</button>
</div>

<script>

let db = {
  news: [],
  songs: [],
  lyrics: []
};

let editIndex = null;

function getType() {
  return document.getElementById("type").value;
}

function addItem() {

  const type = getType();

  const item = {
    title: title.value,
    date: date.value,
    image: image.value,
    text: text.value
  };

  if(editIndex !== null) {
    db[type][editIndex] = item;
    editIndex = null;
  } else {
    db[type].push(item);
  }

  clearForm();
  render();
}

function clearForm() {
  title.value = "";
  date.value = "";
  image.value = "";
  text.value = "";
}

function editItem(i) {
  const type = getType();
  const item = db[type][i];

  title.value = item.title;
  date.value = item.date;
  image.value = item.image;
  text.value = item.text;

  editIndex = i;
  renderPreview(item);
}

function deleteItem(i) {
  const type = getType();
  db[type].splice(i,1);
  render();
}

function moveUp(i) {
  const type = getType();
  if(i === 0) return;
  [db[type][i-1], db[type][i]] = [db[type][i], db[type][i-1]];
  render();
}

function renderPreview(item) {
  document.getElementById("preview").innerHTML = `
    <b>${item.title}</b><br>
    <small>${item.date}</small><br>
    <p>${item.text}</p>
  `;
}

function render() {

  const type = getType();
  const list = document.getElementById("list");

  list.innerHTML = "";

  db[type].forEach((item, i) => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <span class="small">${item.date}</span><br>
      <span class="small">${item.text?.slice(0,80)}</span><br>

      <div class="row">
        <button onclick="editItem(${i})">✏ Edit</button>
        <button onclick="deleteItem(${i})">🗑 Delete</button>
        <button onclick="moveUp(${i})">⬆ Up</button>
      </div>
    `;

    list.appendChild(div);
  });
}

function download() {
  const type = getType();

  const blob = new Blob(
    [JSON.stringify(db[type], null, 2)],
    {type:"application/json"}
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = type + ".json";
  a.click();
}

render();

</script>

</body>
</html>
