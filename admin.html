<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Multi Dashboard v2 | Eselhans</title>

<style>
body {
  font-family: Arial;
  background:#0b0b10;
  color:#f4f1ea;
  padding:30px;
}

h1 { margin-bottom: 20px; }

select, input, textarea {
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:#fff;
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:0;
  background:#c98b4f;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.card {
  background:#15151d;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

.item {
  padding:10px;
  margin-top:10px;
  border:1px solid #333;
  border-radius:10px;
  background:#111;
}

.row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.small {
  font-size: 0.8rem;
  color:#b9b0a6;
}
</style>
</head>

<body>

<h1>🧠 Multi Dashboard v2</h1>

<div class="card">

  <label>Kategorie</label>
  <select id="type" onchange="render()">
    <option value="news">📰 News</option>
    <option value="songs">🎵 Songs</option>
    <option value="lyrics">📝 Lyrics</option>
  </select>

  <input id="title" placeholder="Titel">
  <input id="date" placeholder="Datum (YYYY-MM-DD)">
  <input id="image" placeholder="Bild (optional)">
  <textarea id="text" placeholder="Text / Lyrics"></textarea>

  <button onclick="addItem()">➕ Hinzufügen</button>
  <button onclick="download()">⬇ JSON Export</button>

</div>

<div class="card">
  <h2>📦 Einträge</h2>
  <div id="list"></div>
</div>

<script>

let db = {
  news: [],
  songs: [],
  lyrics: []
};

function getType() {
  return document.getElementById("type").value;
}

function addItem() {

  const type = getType();

  const item = {
    title: title.value,
    date: date.value,
    image: image.value,
    text: text.value
  };

  db[type].push(item);

  clearForm();
  render();
}

function clearForm() {
  title.value = "";
  date.value = "";
  image.value = "";
  text.value = "";
}

function deleteItem(index) {
  const type = getType();
  db[type].splice(index, 1);
  render();
}

function render() {

  const type = getType();
  const list = document.getElementById("list");

  list.innerHTML = "";

  db[type].forEach((item, i) => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <span class="small">${item.date || ""}</span><br>
      <span class="small">${item.text?.slice(0,80) || ""}</span><br>

      <div class="row">
        <button onclick="deleteItem(${i})">🗑 Löschen</button>
      </div>
    `;

    list.appendChild(div);
  });
}

function download() {

  const type = getType();

  const blob = new Blob(
    [JSON.stringify(db[type], null, 2)],
    {type:"application/json"}
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = type + ".json";
  a.click();
}

render();

</script>

</body>
</html>
