<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eselhans | Songs</title>

<link rel="stylesheet" href="style.css">

<style>
.album {
  margin-top: 42px;
}

.album-title {
  font-size: 2rem;
  margin-bottom: 14px;
  color: var(--accent);
}

.song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}

.song-card {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  overflow: hidden;
  transition: 0.25s;
  display: flex;
  flex-direction: column;
}

.song-card:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,0.08);
}

.song-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.song-content {
  padding: 14px;
}

.song-title {
  font-size: 1.1rem;
  font-weight: bold;
}

.song-meta {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 6px 0;
}

.button-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.button-row a,
.button-row button {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  cursor: pointer;
  font-size: 0.85rem;
  text-decoration: none;
}

.button-row a:hover,
.button-row button:hover {
  background: var(--accent-soft);
  border-color: rgba(201,139,79,0.6);
}

.lyrics {
  display: none;
  margin-top: 10px;
  white-space: pre-line;
  color: var(--muted);
  font-size: 0.9rem;
}

.song-card.active .lyrics {
  display: block;
}
</style>
</head>

<body>

<main class="page">

<nav class="topbar">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="bilder/logo-eselhans.png">
    Eselhans
  </a>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="news.html">News</a>
  </div>
</nav>

<header class="hero">
  <div style="margin-top:20px;">
  <input id="search" type="text" placeholder="Suche Songs..."
    style="
      width:100%;
      padding:12px 16px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.05);
      color:var(--text);
      outline:none;
    ">
</div>
  <span class="eyebrow">Music System</span>
  <h1>Songs</h1>
  <p class="lead">Alle Songs, sauber sortiert nach Alben & Singles.</p>
</header>

<section id="albums"></section>

</main>

<script>
let allSongs = [];

fetch("songs.json")
  .then(res => res.json())
  .then(data => {

    allSongs = data.songs;
    render(allSongs);

    document.getElementById("search").addEventListener("input", (e) => {
      const val = e.target.value.toLowerCase();

      const filtered = allSongs.filter(song =>
        (song.title || "").toLowerCase().includes(val) ||
        (song.album || "").toLowerCase().includes(val) ||
        (song.genre || "").toLowerCase().includes(val)
      );

      render(filtered);
    });
  });

function render(songs) {
  const container = document.getElementById("albums");
  container.innerHTML = "";

  // GROUPING
  const grouped = {};

  songs.forEach(song => {
    const album = song.album && song.album.trim() !== "" ? song.album : "Singles";
    if (!grouped[album]) grouped[album] = [];
    grouped[album].push(song);
  });

  // RENDER
  Object.keys(grouped).forEach(albumName => {

    const albumDiv = document.createElement("div");
    albumDiv.className = "album";

    let html = `<div class="album-title">${albumName}</div>`;
    html += `<div class="song-grid">`;

    grouped[albumName].forEach(song => {

      html += `
        <div class="song-card">

          <img src="${song.cover || 'bilder/cover-platzhalter.png'}">

          <div class="song-content">

            <div class="song-title">${song.title}</div>

            <div class="song-meta">
              ${song.genre || "—"} • ${song.release || "—"}
            </div>

            <div class="button-row">
              <a href="${song.youtube}" target="_blank">YouTube</a>
              <button onclick="this.closest('.song-card').classList.toggle('active')">
                Lyrics
              </button>
            </div>

            <div class="lyrics">
              ${song.lyrics || "Noch keine Lyrics vorhanden"}
            </div>

          </div>
        </div>
      `;
    });

    html += `</div>`;
    albumDiv.innerHTML = html;
    container.appendChild(albumDiv);
  });
}
</script>

</body>
</html>
