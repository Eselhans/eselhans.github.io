<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V9 - Clean CMS</title>

<link rel="stylesheet" href="style.css">

<style>
body { padding:20px; font-family:Arial; }

.bar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:16px;
}

.card {
  border:1px solid var(--border);
  padding:14px;
  border-radius:14px;
  background: rgba(255,255,255,0.05);
}

.item {
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--border);
  cursor:pointer;
}

.small {
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<h1>🎛 Admin V9 - Clean CMS</h1>

<div class="bar">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('song')">Songs</button>
  <button onclick="filter('news')">News</button>

  <button onclick="save()">💾 Save Local</button>
  <button onclick="exportJSON()">⬇ Export</button>
</div>

<div class="container">

<!-- LIST -->
<div class="card">
<h2>📦 Content</h2>
<div id="list"></div>
</div>

<!-- EDITOR -->
<div class="card">
<h2>✏ Editor</h2>

<input id="title" placeholder="Title">
<input id="type" placeholder="Type (song/news)">
<input id="date" placeholder="Date">
<input id="image" placeholder="Image URL">
<textarea id="text" placeholder="Text"></textarea>

<input id="meta_album" placeholder="Album (optional)">
<input id="meta_genre" placeholder="Genre (optional)">

<button onclick="saveItem()">Save Item</button>
<button onclick="clearForm()">Clear</button>

</div>

</div>

<script>

let data = [];
let currentId = null;
let activeFilter = "all";

// LOAD
fetch("content.json")
  .then(r => r.json())
  .then(d => {
    data = d.items || [];
    render();
  });

// FILTER
function filter(type) {
  activeFilter = type;
  render();
}

// GET FILTERED DATA
function getFiltered() {
  if(activeFilter === "all") return data;
  return data.filter(x => x.type === activeFilter);
}

// RENDER
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  getFiltered().forEach(item => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <span class="small">${item.type} • ${item.date || ""}</span>
    `;

    div.onclick = () => load(item.id);

    list.appendChild(div);
  });

  saveLocal();
}

// LOAD ITEM INTO EDITOR
function load(id) {

  const item = data.find(x => x.id === id);
  if(!item) return;

  currentId = id;

  title.value = item.title || "";
  type.value = item.type || "";
  date.value = item.date || "";
  image.value = item.image || "";
  text.value = item.text || "";

  meta_album.value = item.meta?.album || "";
  meta_genre.value = item.meta?.genre || "";
}

// SAVE ITEM
function saveItem() {

  const item = {
    id: currentId || Date.now().toString(),
    type: type.value,
    title: title.value,
    date: date.value,
    image: image.value,
    text: text.value,
    meta: {
      album: meta_album.value,
      genre: meta_genre.value
    }
  };

  const index = data.findIndex(x => x.id === item.id);

  if(index >= 0) data[index] = item;
  else data.push(item);

  currentId = null;
  clearForm();
  render();
}

// CLEAR
function clearForm() {
  title.value = "";
  type.value = "";
  date.value = "";
  image.value = "";
  text.value = "";
  meta_album.value = "";
  meta_genre.value = "";
}

// SAVE LOCAL
function saveLocal() {
  localStorage.setItem("v9", JSON.stringify(data));
}

// SAVE BUTTON
function save() {
  saveLocal();
  alert("Saved locally");
}

// EXPORT
function exportJSON() {
  const blob = new Blob(
    [JSON.stringify({ items: data }, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "content.json";
  a.click();
}

</script>

</body>
</html>
