<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Eselhans | Songtexte</title>

<link rel="stylesheet" href="style.css">

<style>
.album {
  margin-top: 25px;
}

.album-title {
  font-size: 1.8rem;
  margin: 20px 0 10px;
  color: var(--accent);
}

.song {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.song:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.08);
}

.lyrics {
  margin-top: 10px;
  white-space: pre-line;
  color: var(--muted);
  display: none;
}

.song.active .lyrics {
  display: block;
}
</style>
</head>

<body>

<main class="page">

<nav class="topbar">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="bilder/logo-eselhans.png">
    Eselhans
  </a>

  <div class="nav-links">
    <a href="musik.html">Musik</a>
    <a href="songtexte.html">Songtexte</a>
    <a href="videos.html">Videos</a>
    <a href="news.html">News</a>
  </div>
</nav>

<header class="hero">
  <span class="eyebrow">Songtexte</span>
  <h1>Lyrics</h1>
  <p class="lead">Alle Songs & Texte aus deinem System</p>
</header>

<section id="container"></section>

</main>

<script>
fetch("songs.json")
  .then(res => res.json())
  .then(data => {

    const container = document.getElementById("container");

    data.albums.forEach(album => {

      const albumDiv = document.createElement("div");
      albumDiv.className = "album";

      let html = `<div class="album-title">${album.title}</div>`;

      album.songs.forEach(song => {

        html += `
          <div class="song" onclick="this.classList.toggle('active')">
            <strong>${song.title}</strong>
            <div class="lyrics">${song.lyrics}</div>
          </div>
        `;
      });

      albumDiv.innerHTML = html;
      container.appendChild(albumDiv);
    });

  });
</script>

</body>
</html>
