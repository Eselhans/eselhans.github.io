<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V5.1 - Creator Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  padding: 20px;
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.card {
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

button {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor: pointer;
  margin-top: 10px;
}

.list-item {
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  cursor: grab;
}

.list-item.dragging {
  opacity: 0.5;
}

.mode-switch {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.mode-switch button {
  flex:1;
}
</style>

</head>

<body>

<h1>🎛 Admin V5.1 Dashboard</h1>

<div class="mode-switch">
  <button onclick="switchMode('songs')">🎵 Songs</button>
  <button onclick="switchMode('news')">📰 News</button>
</div>

<div class="container">

<!-- LEFT -->
<div>

<div class="card">
<h2>Editor</h2>

<!-- SONG FIELDS -->
<div id="songFields">
<input id="title" placeholder="Titel">
<input id="album" placeholder="Album">
<input id="genre" placeholder="Genre">
<input id="release" placeholder="Release">
<input id="youtube" placeholder="YouTube">
<input id="cover" placeholder="Cover">
<textarea id="lyrics" placeholder="Lyrics"></textarea>
</div>

<!-- NEWS FIELDS -->
<div id="newsFields" style="display:none;">
<input id="title" placeholder="Titel">
<input id="date" placeholder="Datum">
<input id="image" placeholder="Bild">
<textarea id="text" placeholder="Text"></textarea>
</div>

<button onclick="saveItem()">💾 Save</button>
<button onclick="undo()">↩ Undo</button>
</div>

<div class="card">
<h2>📦 Liste</h2>
<div id="list"></div>
</div>

</div>

<!-- RIGHT -->
<div class="card">
<h2>👁 Live Preview</h2>
<div id="preview"></div>

<hr>

<button onclick="download()">⬇ Export JSON</button>
</div>

</div>

<script>

let songs = [];
let news = [];
let mode = "songs";
let currentEdit = null;

// LOAD
Promise.all([
  fetch("songs.json").then(r => r.json()),
  fetch("news.json").then(r => r.json())
]).then(([s, n]) => {
  songs = s.songs || [];
  news = n.news || [];
  render();
  autosave();
});

// SWITCH MODE
function switchMode(m) {
  mode = m;
  currentEdit = null;

  document.getElementById("songFields").style.display = m === "songs" ? "block" : "none";
  document.getElementById("newsFields").style.display = m === "news" ? "block" : "none";

  clear();
  render();
}

// AUTOSAVE
function autosave() {
  localStorage.setItem("songs_backup", JSON.stringify(songs));
  localStorage.setItem("news_backup", JSON.stringify(news));
}

// UNDO (simple global restore)
function undo() {
  const s = localStorage.getItem("songs_backup");
  const n = localStorage.getItem("news_backup");

  if(s) songs = JSON.parse(s);
  if(n) news = JSON.parse(n);

  render();
}

// SAVE
function saveItem() {

  if(mode === "songs") {

    const song = {
      id: currentEdit || title.value.toLowerCase().replaceAll(" ","-"),
      title: title.value,
      album: album.value,
      genre: genre.value,
      release: release.value,
      youtube: youtube.value,
      cover: cover.value,
      lyrics: lyrics.value
    };

    const i = songs.findIndex(x => x.id === song.id);
    if(i >= 0) songs[i] = song;
    else songs.push(song);

  } else {

    const item = {
      id: currentEdit || Date.now().toString(),
      title: title.value,
      date: date.value,
      image: image.value,
      text: text.value
    };

    const i = news.findIndex(x => x.id === item.id);
    if(i >= 0) news[i] = item;
    else news.push(item);
  }

  currentEdit = null;
  clear();
  render();
  autosave();
}

// CLEAR
function clear() {
  document.querySelectorAll("input, textarea").forEach(i => i.value = "");
}

// RENDER LIST
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  const data = mode === "songs" ? songs : news;

  data.forEach(item => {

    const div = document.createElement("div");
    div.className = "list-item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <small>${item.album || item.date || ""}</small><br>

      <button onclick="edit('${item.id}')">✏</button>
      <button onclick="del('${item.id}')">🗑</button>
    `;

    list.appendChild(div);
  });

  preview();
  autosave();
}

// EDIT
function edit(id) {

  const arr = mode === "songs" ? songs : news;
  const item = arr.find(x => x.id === id);

  currentEdit = id;

  for(let key in item) {
    const el = document.getElementById(key);
    if(el) el.value = item[key];
  }
}

// DELETE
function del(id) {
  if(mode === "songs") {
    songs = songs.filter(s => s.id !== id);
  } else {
    news = news.filter(n => n.id !== id);
  }
  render();
}

// PREVIEW
function preview() {
  const p = document.getElementById("preview");

  if(mode === "songs") {
    const f = songs[0];
    p.innerHTML = f ? `<h3>${f.title}</h3><p>${f.album}</p>` : "";
  } else {
    const f = news[0];
    p.innerHTML = f ? `<h3>${f.title}</h3><p>${f.date}</p><p>${f.text}</p>` : "";
  }
}

// EXPORT
function download() {

  const data = mode === "songs"
    ? { songs }
    : { news };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = mode + ".json";
  a.click();
}

</script>

</body>
</html>
