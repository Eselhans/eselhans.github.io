<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Eselhans | Musik</title>

<link rel="stylesheet" href="style.css">

<style>
.album {
  margin-top: 30px;
}

.album-title {
  font-size: 1.8rem;
  margin-bottom: 12px;
  color: var(--accent);
}

.song-card {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  transition: 0.2s;
  cursor: pointer;
}

.song-card:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.08);
}

.song-title {
  font-weight: bold;
}

.song-lyrics {
  margin-top: 10px;
  color: var(--muted);
  white-space: pre-line;
  display: none;
}

.song-card.active .song-lyrics {
  display: block;
}
</style>

</head>

<body>

<main class="page">

<nav class="topbar">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="bilder/logo-eselhans.png">
    Eselhans
  </a>

  <div class="nav-links">
    <a href="musik.html">Musik</a>
    <a href="songtexte.html">Songtexte</a>
    <a href="videos.html">Videos</a>
    <a href="news.html">News</a>
  </div>
</nav>

<header class="hero">
  <span class="eyebrow">Musik</span>
  <h1>Releases</h1>
  <p class="lead">Alle Songs & Alben aus deinem System</p>
</header>

<section id="container"></section>

</main>

<script>
fetch("songs.json")
  .then(res => res.json())
  .then(data => {

    const container = document.getElementById("container");

    data.albums.forEach(album => {

      const albumDiv = document.createElement("div");
      albumDiv.className = "album";

      let html = `<div class="album-title">${album.title}</div>`;

      album.songs.forEach(song => {

        html += `
          <div class="song-card" onclick="this.classList.toggle('active')">
            <div class="song-title">${song.title}</div>

            <div class="song-lyrics">
              ${song.lyrics || "Kein Text vorhanden"}
            </div>
          </div>
        `;
      });

      albumDiv.innerHTML = html;
      container.appendChild(albumDiv);
    });

  });
</script>

</body>
</html>
