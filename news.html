<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Eselhans | News</title>

  <meta name="description" content="News und Updates von Eselhans" />
  <link rel="canonical" href="https://eselhans.github.io/news.html" />

  <link rel="stylesheet" href="style.css">

  <style>
    .news-list {
      display: grid;
      gap: 18px;
    }

    .news-box {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
    }

    .news-box img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 14px;
    }

    @media (max-width: 800px) {
      .news-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- NAV -->
    <nav class="topbar">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="bilder/logo-eselhans.png" alt="Logo">
        Eselhans
      </a>

      <div class="nav-links">
        <a href="news.html">News</a>
        <a href="about.html">Über mich</a>
        <a href="songs.html">Songs</a>
      </div>
    </nav>

    <!-- HEADER -->
    <header class="hero">
      <span class="eyebrow">News & Updates</span>
      <h1>News</h1>
      <p class="lead">
        Alle Updates, Releases und Projekte an einem Ort.
      </p>
    </header>

    <!-- NEWS -->
    <section class="section-card">
      <div id="news-container" class="news-list"></div>
    </section>

    <!-- SCRIPT -->
    <script>
      // 🔧 SAFE LOADER (WICHTIG)
      async function loadJSON(file, key) {
        try {
          const res = await fetch(file);
          if (!res.ok) return [];

          const data = await res.json();

          if (Array.isArray(data)) return data;
          if (data && Array.isArray(data[key])) return data[key];

          return [];

        } catch (e) {
          console.error("Load error:", e);
          return [];
        }
      }

      async function loadNews() {

        const news = await loadJSON("news.json", "news");

        const container = document.getElementById("news-container");
        container.innerHTML = "";

        if (!news.length) {
          container.innerHTML = "<p>Keine News vorhanden</p>";
          return;
        }

        news
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .forEach(n => {

            const el = document.createElement("div");
            el.className = "news-box";

            el.innerHTML = `
              <div>
                <img src="${n.image || 'bilder/cover-platzhalter.png'}"
                     onerror="this.src='bilder/cover-platzhalter.png'">
              </div>

              <div>
                <span class="news-label">NEWS</span>
                <h3>${n.title || ""}</h3>
                <p>${n.date || ""}</p>
                <p>${n.text || ""}</p>
              </div>

              <div>
                <a class="button" href="news.html">Open</a>
              </div>
            `;

            container.appendChild(el);
          });
      }

      loadNews();
    </script>

  </main>
</body>
</html>
