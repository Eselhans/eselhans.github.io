<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Eselhans Admin - Songs System</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  padding: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

button {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor: pointer;
  margin-top: 10px;
}

.song-box {
  border: 1px solid var(--border);
  padding: 12px;
  margin: 10px 0;
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
}
</style>

</head>

<body>

<h1>🎵 Songs Admin System</h1>

<div class="card">

<h2>Neuer Song</h2>

<input id="title" placeholder="Titel">
<input id="album" placeholder="Album (leer = Singles)">
<input id="genre" placeholder="Genre">
<input id="release" placeholder="Release Datum">
<input id="youtube" placeholder="YouTube Link">
<input id="cover" placeholder="Cover URL">
<textarea id="lyrics" placeholder="Lyrics"></textarea>

<button onclick="addSong()">➕ Song hinzufügen</button>

</div>

<hr>

<h2>📦 Songs</h2>
<div id="list"></div>

<hr>

<button onclick="downloadJSON()">⬇ songs.json Download</button>

<script>

let songs = [];

fetch("songs.json")
  .then(res => res.json())
  .then(data => {
    songs = data.songs || [];
    render();
  });

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  songs.forEach((s, i) => {

    const div = document.createElement("div");
    div.className = "song-box";

    div.innerHTML = `
      <b>${s.title}</b><br>
      <small>${s.album || "Singles"}</small><br>
      <small>${s.genre || ""}</small><br>

      <button onclick="removeSong(${i})">🗑 Delete</button>
    `;

    list.appendChild(div);
  });
}

function addSong() {

  const song = {
    id: title.value.toLowerCase().replaceAll(" ","-"),
    title: title.value,
    album: album.value || "Singles",
    genre: genre.value,
    release: release.value,
    youtube: youtube.value,
    cover: cover.value || "bilder/cover-platzhalter.png",
    lyrics: lyrics.value
  };

  songs.push(song);
  render();
}

function removeSong(i) {
  songs.splice(i, 1);
  render();
}

function downloadJSON() {

  const data = { songs };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "songs.json";
  a.click();
}

</script>

</body>
</html>
