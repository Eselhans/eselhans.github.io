<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V6 - Creator Studio</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  padding: 20px;
  font-family: Arial;
}

.topbar {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.topbar button {
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:16px;
}

.card {
  border:1px solid var(--border);
  padding:14px;
  border-radius:14px;
  background: rgba(255,255,255,0.05);
}

.item {
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background: rgba(0,0,0,0.2);
  cursor: grab;
}

.item[contenteditable="true"] {
  outline: 2px solid var(--accent);
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

.actions {
  display:flex;
  gap:8px;
  margin-top:6px;
}

.actions button {
  padding:5px 8px;
  font-size:12px;
}
</style>

</head>

<body>

<h1>🎛 Admin V6 Studio</h1>

<div class="topbar">
  <button onclick="mode='songs'; render()">🎵 Songs</button>
  <button onclick="mode='news'; render()">📰 News</button>
  <button onclick="saveToFile()">💾 Export JSON</button>
</div>

<div class="container">

<!-- LIST -->
<div class="card">
<h2>📦 Liste (Drag + Inline Edit)</h2>
<div id="list"></div>
</div>

<!-- PREVIEW -->
<div class="card">
<h2>👁 Preview</h2>
<div id="preview"></div>
</div>

</div>

<script>

let mode = "songs";

let songs = [];
let news = [];

let dragIndex = null;

// LOAD
Promise.all([
  fetch("songs.json").then(r => r.json()),
  fetch("news.json").then(r => r.json())
]).then(([s, n]) => {
  songs = s.songs || [];
  news = n.news || [];
  render();
});

// GET ACTIVE ARRAY
function getData() {
  return mode === "songs" ? songs : news;
}

// RENDER
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  getData().forEach((item, i) => {

    const div = document.createElement("div");
    div.className = "item";
    div.draggable = true;
    div.contentEditable = true;
    div.innerHTML = `
      <b>${item.title}</b><br>
      <span class="small">${item.album || item.date || ""}</span>
    `;

    // INLINE EDIT → SAVE ON BLUR
    div.addEventListener("blur", () => {
      const text = div.innerText.split("\n")[0];
      item.title = text;
      autosave();
    }, true);

    // DRAG START
    div.addEventListener("dragstart", () => {
      dragIndex = i;
    });

    div.addEventListener("dragover", (e) => e.preventDefault());

    div.addEventListener("drop", () => {
      const arr = getData();

      const dragged = arr[dragIndex];
      arr.splice(dragIndex, 1);
      arr.splice(i, 0, dragged);

      dragIndex = null;
      render();
      autosave();
    });

    list.appendChild(div);
  });

  preview();
}

// PREVIEW
function preview() {

  const p = document.getElementById("preview");
  const data = getData();

  if(!data.length) {
    p.innerHTML = "Empty";
    return;
  }

  const f = data[0];

  p.innerHTML = `
    <h3>${f.title}</h3>
    <p>${f.album || f.date || ""}</p>
  `;
}

// AUTOSAVE
function autosave() {
  localStorage.setItem("songs", JSON.stringify(songs));
  localStorage.setItem("news", JSON.stringify(news));
}

// LOAD AUTOSAVE
function loadSave() {
  const s = localStorage.getItem("songs");
  const n = localStorage.getItem("news");

  if(s) songs = JSON.parse(s);
  if(n) news = JSON.parse(n);
}

// EXPORT
function saveToFile() {

  const data = mode === "songs"
    ? { songs }
    : { news };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = mode + ".json";
  a.click();
}

</script>

</body>
</html>
