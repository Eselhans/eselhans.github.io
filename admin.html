<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V5 - Creator Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  padding: 20px;
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.card {
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

button {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor: pointer;
  margin-top: 10px;
}

.list-item {
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  cursor: grab;
}

.list-item.dragging {
  opacity: 0.5;
}
</style>

</head>

<body>

<h1>🎛 Admin V5 Dashboard</h1>

<div class="container">

<!-- LEFT -->
<div>

<div class="card">
<h2>Editor</h2>

<input id="title" placeholder="Titel">
<input id="album" placeholder="Album">
<input id="genre" placeholder="Genre">
<input id="release" placeholder="Release">
<input id="youtube" placeholder="YouTube">
<input id="cover" placeholder="Cover">
<textarea id="lyrics" placeholder="Lyrics"></textarea>

<button onclick="saveItem()">💾 Save</button>
<button onclick="undo()">↩ Undo</button>
</div>

<div class="card">
<h2>📦 Liste (Drag & Drop)</h2>
<div id="list"></div>
</div>

</div>

<!-- RIGHT -->
<div class="card">
<h2>👁 Live Preview</h2>
<div id="preview"></div>

<hr>

<button onclick="download()">⬇ Export JSON</button>
</div>

</div>

<script>
  
let songs = [];
let news = [];
let mode = "songs";
let history = [];
let currentEdit = null;

// LOAD
fetch("songs.json")
  .then(r => r.json())
  .then(d => {
    songs = d.songs || [];
    render();
    autosave();
  });

// AUTOSAVE
function autosave() {
  localStorage.setItem("songs_backup", JSON.stringify(songs));
}

// UNDO
function undo() {
  const backup = localStorage.getItem("songs_backup");
  if(backup) {
    songs = JSON.parse(backup);
    render();
  }
}

// SAVE / UPDATE
function saveItem() {

  const song = {
    id: currentEdit || title.value.toLowerCase().replaceAll(" ","-"),
    title: title.value,
    album: album.value,
    genre: genre.value,
    release: release.value,
    youtube: youtube.value,
    cover: cover.value,
    lyrics: lyrics.value
  };

  const index = songs.findIndex(s => s.id === song.id);

  if(index >= 0) songs[index] = song;
  else songs.push(song);

  currentEdit = null;
  clear();
  render();
  autosave();
}

// CLEAR FORM
function clear() {
  document.querySelectorAll("input, textarea").forEach(i => i.value = "");
}

// RENDER
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  songs.forEach((s, i) => {

    const div = document.createElement("div");
    div.className = "list-item";
    div.draggable = true;

    div.innerHTML = `
      <b>${s.title}</b><br>
      <small>${s.album || "Singles"}</small>
      <button onclick="edit('${s.id}')">✏</button>
      <button onclick="del('${s.id}')">🗑</button>
    `;

    // DRAG
    div.addEventListener("dragstart", () => {
      div.classList.add("dragging");
      div.dataset.index = i;
    });

    div.addEventListener("dragend", () => {
      div.classList.remove("dragging");
    });

    div.addEventListener("dragover", (e) => e.preventDefault());

    div.addEventListener("drop", (e) => {
      e.preventDefault();

      const from = e.dataTransfer?.getData("text") || div.dataset.index;
    });

    list.appendChild(div);
  });

  preview();
  autosave();
}

// EDIT
function edit(id) {
  const s = songs.find(x => x.id === id);
  currentEdit = id;

  title.value = s.title;
  album.value = s.album;
  genre.value = s.genre;
  release.value = s.release;
  youtube.value = s.youtube;
  cover.value = s.cover;
  lyrics.value = s.lyrics;
}

// DELETE
function del(id) {
  songs = songs.filter(s => s.id !== id);
  render();
  autosave();
}

// PREVIEW
function preview() {
  const p = document.getElementById("preview");

  const featured = songs[0];

  p.innerHTML = featured ? `
    <h3>${featured.title}</h3>
    <p>${featured.album}</p>
    <p>${featured.genre}</p>
  ` : "";
}

// EXPORT
function download() {
  const blob = new Blob(
    [JSON.stringify({ songs }, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "songs.json";
  a.click();
}

</script>

</body>
</html>
