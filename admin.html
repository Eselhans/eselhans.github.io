<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V4 - Eselhans CMS</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  padding: 20px;
}

.tabs {
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab {
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  cursor:pointer;
  background: rgba(255,255,255,0.05);
}

.tab.active {
  background: var(--accent-soft);
}

input, textarea {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor:pointer;
  margin-top:10px;
}

.card {
  border:1px solid var(--border);
  padding:14px;
  margin-top:14px;
  border-radius:14px;
  background: rgba(255,255,255,0.05);
}

.row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
</style>

</head>

<body>

<h1>🎛 Admin V4 System</h1>

<div class="tabs">
  <div class="tab active" onclick="switchMode('songs')">🎵 Songs</div>
  <div class="tab" onclick="switchMode('news')">📰 News</div>
</div>

<div class="card" id="form"></div>

<hr>

<h2>📦 Liste</h2>
<div id="list"></div>

<hr>

<button onclick="download()">⬇ Export JSON</button>

<script>

let mode = "songs";

let db = {
  songs: [],
  news: []
};

let editId = null;

// INIT
fetch("songs.json")
  .then(r => r.json())
  .then(d => {
    db.songs = d.songs || [];
    renderForm();
    render();
  });

// SWITCH
function switchMode(m) {
  mode = m;
  editId = null;
  renderForm();
  render();
}

// FORM
function renderForm() {

  const f = document.getElementById("form");

  if(mode === "songs") {
    f.innerHTML = `
      <h3>${editId ? "Song bearbeiten" : "Neuer Song"}</h3>

      <input id="title" placeholder="Titel">
      <input id="album" placeholder="Album">
      <input id="genre" placeholder="Genre">
      <input id="release" placeholder="Release">
      <input id="youtube" placeholder="YouTube">
      <input id="cover" placeholder="Cover">
      <textarea id="lyrics" placeholder="Lyrics"></textarea>

      <button onclick="save()">💾 Save</button>
    `;
  } else {
    f.innerHTML = `
      <h3>${editId ? "News bearbeiten" : "Neue News"}</h3>

      <input id="title" placeholder="Titel">
      <input id="date" placeholder="Datum">
      <input id="image" placeholder="Bild">
      <textarea id="text" placeholder="Text"></textarea>

      <button onclick="save()">💾 Save</button>
    `;
  }
}

// SAVE (CREATE + UPDATE LOGIC)
function save() {

  if(mode === "songs") {

    const song = {
      id: editId || title.value.toLowerCase().replaceAll(" ","-"),
      title: title.value,
      album: album.value || "Singles",
      genre: genre.value,
      release: release.value,
      youtube: youtube.value,
      cover: cover.value,
      lyrics: lyrics.value
    };

    const index = db.songs.findIndex(s => s.id === song.id);

    if(index >= 0) {
      db.songs[index] = song;
    } else {
      db.songs.push(song);
    }

  } else {

    const item = {
      id: editId || Date.now().toString(),
      title: title.value,
      date: date.value,
      image: image.value,
      text: text.value
    };

    const index = db.news.findIndex(n => n.id === item.id);

    if(index >= 0) {
      db.news[index] = item;
    } else {
      db.news.push(item);
    }
  }

  editId = null;
  clear();
  render();
}

// CLEAR
function clear() {
  document.querySelectorAll("input, textarea").forEach(el => el.value = "");
}

// RENDER LIST
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  const arr = db[mode];

  arr.forEach(item => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <small>${item.album || item.date || ""}</small><br>

      <div class="row">
        <button onclick="edit('${item.id}')">✏ Edit</button>
        <button onclick="del('${item.id}')">🗑 Delete</button>
      </div>
    `;

    list.appendChild(div);
  });
}

// EDIT
function edit(id) {

  const item = db[mode].find(x => x.id === id);
  editId = id;

  for(let key in item) {
    const el = document.getElementById(key);
    if(el) el.value = item[key];
  }

  renderForm();
}

// DELETE
function del(id) {
  db[mode] = db[mode].filter(x => x.id !== id);
  render();
}

// EXPORT
function download() {

  const blob = new Blob(
    [JSON.stringify(db[mode], null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = mode + ".json";
  a.click();
}

</script>

</body>
</html>
