<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V8 - CLEAN FIX</title>

<link rel="stylesheet" href="style.css">

<style>
body { padding:20px; font-family:Arial; }

.bar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:16px;
}

.card {
  border:1px solid var(--border);
  padding:14px;
  border-radius:14px;
  background: rgba(255,255,255,0.05);
}

.item {
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid var(--border);
  cursor:pointer;
}
</style>

</head>

<body>

<h1>🎛 Admin V8 FIXED</h1>

<div class="bar">
  <button onclick="mode='songs'; render()">🎵 Songs</button>
  <button onclick="mode='news'; render()">📰 News</button>

  <button onclick="saveLocal()">💾 Save Local</button>
  <button onclick="exportAll()">⬇ Export JSON</button>
  <button onclick="importFile()">⬆ Import</button>
</div>

<div class="container">

<div class="card">
<h2>📦 Content</h2>
<div id="list"></div>
</div>

<div class="card">
<h2>✏ Editor</h2>

<input id="title" placeholder="Title">
<input id="album" placeholder="Album / Date">
<input id="extra1" placeholder="Extra 1">
<input id="extra2" placeholder="Extra 2">
<textarea id="text" placeholder="Text"></textarea>

<button onclick="saveItem()">Save</button>
<button onclick="deleteItem()">Delete</button>
</div>

</div>

<input type="file" id="fileInput" style="display:none">

<script>

let mode = "songs";
let songs = [];
let news = [];
let currentEdit = null;

// LOAD
Promise.all([
  fetch("songs.json").then(r => r.json()),
  fetch("news.json").then(r => r.json())
]).then(([s,n]) => {
  songs = s.songs || [];
  news = n.news || [];
  render();
});

// GET DATA
function getData() {
  return mode === "songs" ? songs : news;
}

// RENDER
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  getData().forEach(item => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      <small>${item.album || item.date || ""}</small>
    `;

    div.onclick = () => loadItem(item.id);

    list.appendChild(div);
  });
}

// LOAD INTO EDITOR
function loadItem(id) {

  const arr = getData();
  const item = arr.find(x => x.id === id);

  if(!item) return;

  currentEdit = id;

  title.value = item.title || "";
  album.value = item.album || item.date || "";
  extra1.value = item.extra1 || item.genre || "";
  extra2.value = item.extra2 || item.youtube || "";
  text.value = item.text || item.lyrics || "";
}

// SAVE
function saveItem() {

  const arr = getData();

  const newItem = {
    id: currentEdit || Date.now().toString(),
    title: title.value,
    album: album.value,
    extra1: extra1.value,
    extra2: extra2.value,
    text: text.value
  };

  const index = arr.findIndex(x => x.id === newItem.id);

  if(index >= 0) {
    arr[index] = newItem;
  } else {
    arr.push(newItem);
  }

  currentEdit = null;
  clear();
  render();
}

// DELETE
function deleteItem() {

  const arr = getData();

  if(!currentEdit) return;

  const index = arr.findIndex(x => x.id === currentEdit);

  if(index >= 0) arr.splice(index, 1);

  currentEdit = null;
  clear();
  render();
}

// CLEAR
function clear() {
  title.value = "";
  album.value = "";
  extra1.value = "";
  extra2.value = "";
  text.value = "";
}

// SAVE LOCAL
function saveLocal() {
  localStorage.setItem("cms", JSON.stringify({ songs, news }));
}

// EXPORT
function exportAll() {
  const blob = new Blob(
    [JSON.stringify({ songs, news }, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "backup.json";
  a.click();
}

// 🚀 GITHUB PUSH (CORE)
async function pushToGitHub() {

  const token = "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";
  const repo = "eselhans/eselhans.github.io";

  const files = [
    { path: "songs.json", content: songs },
    { path: "news.json", content: news }
  ];

  for(const file of files) {

    await fetch(`https://api.github.com/repos/${repo}/contents/${file.path}`, {
      method: "PUT",
      headers: {
        "Authorization": `token ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "CMS Update",
        content: btoa(JSON.stringify(file.content, null, 2)),
        sha: await getSHA(repo, file.path, token)
      })
    });

  }

  alert("🚀 Push complete");
}

// IMPORT
function importFile() {
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", e => {

  const reader = new FileReader();

  reader.onload = ev => {
    const data = JSON.parse(ev.target.result);
    songs = data.songs || [];
    news = data.news || [];
    render();
  };

  reader.readAsText(e.target.files[0]);
});

</script>

</body>
</html>
