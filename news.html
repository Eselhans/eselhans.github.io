<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News - Eselhans</title>

<style>
body { font-family: Arial, sans-serif; background:#111; color:#fff; margin:0; padding:20px; }
h1 { color:#f5c542; }
.card { background:#1c1c1c; padding:15px; margin:15px 0; border-radius:12px; }
.date { font-size:0.85em; opacity:0.7; margin-bottom:10px; }
img { width:100%; max-width:420px; border-radius:10px; margin-top:10px; }
</style>

</head>
<body>

<h1>News</h1>
<div id="news"></div>

<script>
fetch('news.json')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('news');

    data.forEach(item => {
      const div = document.createElement('div');
      div.className = 'card';

      div.innerHTML = `
        <h2>${item.title}</h2>
        <div class="date">${item.date}</div>
        <p>${item.text}</p>
        ${item.cover ? `<img src="${item.cover}">` : ''}
      `;

      container.appendChild(div);
    });
  });
</script>

</body>
</html>
