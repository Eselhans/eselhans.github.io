<meta name="robots" content="index,follow" />

<meta property="og:description" content="Alle Songs, Videos, Cover und Songtexte von Eselhans gesammelt auf einer Seite." />
<meta property="og:url" content="https://eselhans.github.io/songs.html" />
<meta property="og:image" content="https://eselhans.github.io/bilder/logo-eselhans.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Eselhans | Songs und Videos" />
<meta name="twitter:description" content="Alle Songs, Videos, Cover und Songtexte von Eselhans gesammelt auf einer Seite." />
<meta name="twitter:image" content="https://eselhans.github.io/bilder/logo-eselhans.png" />

<style>
.album {
  margin-top: 42px;
}

.album-title {
  font-size: 2rem;
  margin-bottom: 14px;
  color: var(--accent);
}

.song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}

.song-card {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  overflow: hidden;
  transition: 0.25s;
  display: flex;
  flex-direction: column;
}

.song-card:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,0.08);
}

.song-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.song-content {
  padding: 14px;
}

.song-title {
  font-size: 1.1rem;
  font-weight: bold;
  line-height: 1.2;
  margin: 0;
}

.song-meta {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 6px 0;
}

.button-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.button-row a,
.button-row button {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  cursor: pointer;
  font-size: 0.85rem;
  text-decoration: none;
}

.button-row a:hover,
.button-row button:hover {
  background: var(--accent-soft);
  border-color: rgba(201,139,79,0.6);
}

.lyrics {
  display: none;
  margin-top: 10px;
  white-space: pre-line;
  color: var(--muted);
  font-size: 0.9rem;
}

.song-card.active .lyrics {
  display: block;
}

.song-card .lyrics {
  display: none;
}
</style>
  <link rel="stylesheet" href="style.css" data-unified-style="true" />
</head>

<body>

<main class="page">

<nav class="topbar">
  <a class="brand" href="/">
    <img class="brand-logo" src="bilder/logo-eselhans.png" alt="Eselhans Logo" />
    Eselhans
  </a>
  <div class="nav-links" aria-label="Hauptnavigation">
    <a href="/">Home</a>
    <a href="songs.html" aria-current="page">Songs und Videos</a>
    <a href="musik.html">Hier Streamen</a>
    <a href="news.html">News</a>
    <a href="about.html">&Uuml;ber mich</a>
  </div>
</nav>

<header class="hero">
  <div style="margin-top:20px;">
  <input id="search" type="text" placeholder="Songs, Alben oder Genre suchen &hellip;" aria-label="Songs, Alben oder Genre suchen"
    style="
      width:100%;
      padding:12px 16px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.05);
      color:var(--text);
      outline:none;
    ">
    <div class="search-summary">
      <p id="search-status" class="search-status" role="status" aria-live="polite" aria-atomic="true">Songs werden geladen &hellip;</p>
      <button id="search-reset" class="button" type="button" hidden>Suche zur&uuml;cksetzen</button>
    </div>
</div>
  <span class="eyebrow">Music System</span>
  <h1>Songs</h1>
  <p class="lead">Alles auf einen Blick und nach Alben & Singles sortiert.</p>
</header>

<section id="albums"></section>

<div id="lyrics-modal" class="lyrics-modal" role="dialog" aria-modal="true" aria-labelledby="lyrics-modal-title" aria-describedby="lyrics-modal-meta" hidden>
  <div class="lyrics-dialog">
    <button class="lyrics-close" type="button" aria-label="Lyrics schlie&szlig;en" onclick="closeLyrics()">Schlie&szlig;en</button>
    <span class="eyebrow">Songtext</span>
    <h2 id="lyrics-modal-title">Songtitel</h2>
    <p id="lyrics-modal-meta" class="song-meta"></p>
    <div id="lyrics-modal-text" class="lyrics-text"></div>
  </div>
</div>

<footer>
  &copy; 2026 Eselhans &middot; Musik, Texte & Gedanken &middot; Songs aus Herz & Staub &middot;
  <a href="impressum.html">Impressum</a> &middot;
  <a href="datenschutz.html">Datenschutz</a>
</footer>

</main>

<script>
let allSongs = [];
let activeLyricsButton = null;

fetch("songs.json")
  .then(res => {
    if (!res.ok) throw new Error("songs.json nicht gefunden");
    return res.json();
  })
  .then(data => {

    allSongs = Array.isArray(data) ? data : data.songs || [];

    const searchInput = document.getElementById("search");
    const searchReset = document.getElementById("search-reset");

    searchInput.addEventListener("input", applySearch);
    searchReset.addEventListener("click", () => {
      searchInput.value = "";
      applySearch();
      searchInput.focus();
    });

    applySearch();

  })
  .catch(err => {
    console.error("LOAD ERROR:", err);
    document.getElementById("albums").innerHTML =
      "<p style='color:red'>songs.json konnte nicht geladen werden</p>";
    document.getElementById("search-status").textContent =
      "Songs konnten nicht geladen werden.";
  });

function applySearch() {
  const searchInput = document.getElementById("search");
  const query = searchInput.value.trim();
  const value = query.toLocaleLowerCase("de");

  const filtered = allSongs.filter(song =>
    (song.title || "").toLocaleLowerCase("de").includes(value) ||
    (song.album || "").toLocaleLowerCase("de").includes(value) ||
    (song.genre || "").toLocaleLowerCase("de").includes(value)
  );

  render(filtered);
  updateSearchStatus(filtered.length, query);
}

function updateSearchStatus(count, query) {
  const status = document.getElementById("search-status");
  const reset = document.getElementById("search-reset");
  const label = count === 1 ? "1 Treffer" : `${count} Treffer`;

  status.textContent = query
    ? count === 0
      ? `Keine Treffer f\u00fcr „${query}“.`
      : `${label} f\u00fcr „${query}“.`
    : label;

  reset.hidden = query === "";
}

function render(songs) {
  const container = document.getElementById("albums");
  container.innerHTML = "";

  // GROUPING
  const grouped = {};

  songs.forEach(song => {
    const album = song.album && song.album.trim() !== "" ? song.album : "Singles";
    if (!grouped[album]) grouped[album] = [];
    grouped[album].push(song);
  });

  // RENDER
  Object.keys(grouped).forEach(albumName => {

    const albumDiv = document.createElement("div");
    albumDiv.className = "album";

    let html = `<h2 class="album-title">${escapeHtml(albumName)}</h2>`;
    html += `<div class="song-grid">`;

    grouped[albumName].forEach(song => {
      const songIndex = allSongs.indexOf(song);

      const youtubeButton = song.youtube
        ? `<a href="${escapeAttribute(song.youtube)}" target="_blank" rel="noopener">YouTube</a>`
        : "";

      html += `
        <div class="song-card">

          <img src="${escapeAttribute(song.cover || 'bilder/cover-platzhalter.png')}" alt="Cover: ${escapeAttribute(song.title || 'Eselhans Song')} von Eselhans" loading="lazy">

          <div class="song-content">

            <h3 class="song-title">${escapeHtml(song.title)}</h3>

            <div class="song-meta">
              ${song.genre || "—"} • ${song.release || "—"}
            </div>

            <div class="button-row">
              ${youtubeButton}
              <button type="button" aria-expanded="false" aria-controls="lyrics-modal" data-song-index="${songIndex}" aria-label="Lyrics zu ${escapeAttribute(song.title || 'diesem Song')} anzeigen" onclick="openLyrics(this)">
                Lyrics
              </button>
            </div>

          </div>
        </div>
      `;
    });

    html += `</div>`;
    albumDiv.innerHTML = html;
    container.appendChild(albumDiv);
  });
}

function openLyrics(button) {
  const index = Number(button.dataset.songIndex);
  const song = allSongs[index];
  if (!song) return;

  if (activeLyricsButton && activeLyricsButton !== button) {
    activeLyricsButton.setAttribute("aria-expanded", "false");
  }

  activeLyricsButton = button;
  button.setAttribute("aria-expanded", "true");

  const meta = [song.album, song.genre, song.release].filter(Boolean).join(" - ");
  document.getElementById("lyrics-modal-title").textContent = song.title || "Song";
  document.getElementById("lyrics-modal-meta").textContent = meta;
  document.getElementById("lyrics-modal-text").textContent = song.lyrics || "Songtext folgt";

  const modal = document.getElementById("lyrics-modal");
  modal.removeAttribute("hidden");
  document.body.classList.add("modal-open");
  modal.querySelector(".lyrics-close").focus();
}

function closeLyrics() {
  const modal = document.getElementById("lyrics-modal");
  modal.setAttribute("hidden", "");
  document.body.classList.remove("modal-open");

  if (activeLyricsButton) {
    activeLyricsButton.setAttribute("aria-expanded", "false");
    activeLyricsButton.focus();
    activeLyricsButton = null;
  }
}

document.getElementById("lyrics-modal").addEventListener("click", (event) => {
  if (event.target.id === "lyrics-modal") {
    closeLyrics();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !document.getElementById("lyrics-modal").hasAttribute("hidden")) {
    closeLyrics();
  }
});

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}
</script>

</body>
</html>
