<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin V9 - UX Upgrade</title>
<style>
:root {
  --accent: #c98b4f;
  --accent-soft: rgba(201,139,79,0.2);
  --border: rgba(255,255,255,0.2);
  --text: #ddd;
  --muted: #aaa;
}
body {
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #222;
  color: #ddd;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}
.bar button {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor: pointer;
}
.bar button:hover {
  background: var(--accent);
}
.mode-label {
  margin-left: 20px;
  padding: 6px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
}
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 600px) {
  .container {
    grid-template-columns: 1fr;
  }
}
.card {
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
}
.card h2 {
  margin-top: 0;
}
.item {
  display: flex;
  align-items: center;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  transition: 0.2s;
}
.item:hover {
  background: var(--accent-soft);
}
.item:focus, .item.active {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  background: rgba(201,139,79,0.1);
}
.item img {
  width: 40px;
  height: 40px;
  object-fit: cover;
  border-radius: 5px;
  margin-right: 10px;
}
.item-info {
  flex: 1;
}
.item-title {
  font-weight: bold;
}
.item-meta {
  font-size: 0.8rem;
  color: var(--muted);
}
label {
  display: block;
  margin-top: 8px;
  font-size: 0.9rem;
}
input, textarea {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
}
textarea {
  height: 100px;
  resize: vertical;
}
button.action {
  margin-top: 10px;
}
#undoSnackbar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #ddd;
  padding: 10px 16px;
  border-radius: 8px;
  display: none;
}
#undoSnackbar button {
  background: none;
  border: none;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
  margin-left: 8px;
}
</style>
</head>
<body>

<h1>🎛 Admin V9 – UX Upgrade</h1>
<div class="bar">
  <!-- Add-Buttons -->
  <button onclick="addNew('songs')">+ Song hinzufügen</button>
  <button onclick="addNew('news')">+ News hinzufügen</button>
  <!-- Modus-Umschaltung -->
  <button onclick="mode='songs'; render()">🎵 Songs</button>
  <button onclick="mode='news'; render()">📰 News</button>
  <span class="mode-label" id="modeLabel"></span>
  <!-- Export/Import -->
  <button onclick="saveLocal()">💾 Save</button>
  <button onclick="exportSongs()">⬇ Songs Export</button>
  <button onclick="exportNews()">⬇ News Export</button>
  <button onclick="importSongs()">⬆ Songs Import</button>
  <button onclick="importNews()">⬆ News Import</button>
</div>

<div class="container">
  <!-- Inhalts-Liste -->
  <div class="card">
    <h2>📦 Inhalte</h2>
    <div id="list"></div>
  </div>
  <!-- Editor -->
  <div class="card">
    <h2>✏ Editor</h2>
    <label>Titel:</label><input id="title" placeholder="Titel">
    <label id="labelAlbumOrDate">Album/Datum:</label><input id="albumOrDate">
    <label>Release (nur Songs):</label><input id="release">
    <label id="labelExtra1">Genre / Extra:</label><input id="extra1">
    <label id="labelExtra2">YouTube / Extra:</label><input id="extra2">
    <label>Cover-/Bild-URL:</label><input id="image" placeholder="URL Cover oder Bild">
    <img id="imgPreview" style="display:none; margin-top:10px; max-width:100%; max-height:150px; border-radius:8px;">
    <label>Text/Lyrics:</label><textarea id="text"></textarea>
    <button class="action" onclick="saveItem()">Save</button>
    <button class="action" onclick="deleteItem()">Delete</button>
    <button class="action" onclick="clearForm()">Clear</button>
  </div>
</div>

<div id="undoSnackbar">
  <span id="undoText"></span> 
  <button onclick="undoDelete()">Undo</button>
</div>

<input type="file" id="fileInput" style="display:none">

<script>
// Globaler Zustand
let mode = 'songs';            // aktueller Modus: 'songs' oder 'news'
let songs = [], news = [];     // Daten-Arrays
let currentEdit = null;        // ID des aktuell editierten Items
let lastDeleted = null;        // Letzte Löschung zum Undo
let undoTimeout = null;        

// Lade initial die JSON-Daten
Promise.all([
  fetch('songs.json').then(r => r.ok ? r.json() : {songs: []}),
  fetch('news.json').then(r => r.ok ? r.json() : {news: []})
]).then(([s, n]) => {
  songs = s.songs || [];
  news = n.news || [];
  // Wenn Backup im localStorage existiert, überschreiben (optional)
  const backup = JSON.parse(localStorage.getItem('cms_v9_backup'));
  if (backup) {
    songs = backup.songs || songs;
    news = backup.news || news;
  }
  render();
});

// Speichert Daten im localStorage (als Backup, Daten bestehen aus {songs, news})
function saveLocal() {
  localStorage.setItem('cms_v9_backup', JSON.stringify({songs, news}));
  alert('Daten lokal gespeichert.');
}

// Export-Funktionen für Dateien
function exportSongs() {
  downloadFile({ songs }, 'songs.json');
}
function exportNews() {
  downloadFile({ news }, 'news.json');
}
function downloadFile(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// Import-Funktionen
function importSongs() {
  fileInput.onchange = (e) => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data.songs)) {
          songs = data.songs;
          render();
          alert('Songs importiert.');
        } else {
          alert('Ungültige songs.json-Datei.');
        }
      } catch {
        alert('Fehler beim Einlesen der Datei.');
      }
    };
    reader.readAsText(e.target.files[0]);
  };
  fileInput.accept = '.json';
  fileInput.click();
}
function importNews() {
  fileInput.onchange = (e) => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data.news)) {
          news = data.news;
          render();
          alert('News importiert.');
        } else {
          alert('Ungültige news.json-Datei.');
        }
      } catch {
        alert('Fehler beim Einlesen der Datei.');
      }
    };
    reader.readAsText(e.target.files[0]);
  };
  fileInput.accept = '.json';
  fileInput.click();
}

// Wechselt in den „Neu anlegen“-Modus (Formular leeren, neuer Eintrag)
function addNew(type) {
  mode = type;
  currentEdit = null;
  clearForm();
  render();
}

// Aktualisiert Modus-Anzeige und Form-Lables
function updateModeLabel() {
  document.getElementById('modeLabel').textContent = mode === 'songs' ? 'Modus: Songs' : 'Modus: News';
  document.getElementById('labelAlbumOrDate').textContent = mode==='songs' ? 'Album:' : 'Datum:';
  document.getElementById('labelExtra1').textContent = mode==='songs' ? 'Genre:' : 'Extra:';
  document.getElementById('labelExtra2').textContent = mode==='songs' ? 'YouTube:' : 'Extra:';
}

// Rendert die Liste der Inhalte je nach Modus
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const data = mode === 'songs' ? songs : news;
  data.forEach(item => {
    const div = document.createElement('div');
    div.setAttribute('role','button');   // Rolle für Screenreader
    div.className = 'item';
    div.tabIndex = 0;                    // fokusierbar
    // kleines Cover-Bild
    const img = document.createElement('img');
    img.src = item.cover || item.image || '';
    img.alt = '';
    if (!img.src) img.style.display = 'none';
    div.appendChild(img);
    // Titel & Metadaten
    const info = document.createElement('div');
    info.className = 'item-info';
    const title = document.createElement('div');
    title.className = 'item-title';
    title.textContent = item.title || '(kein Titel)';
    const meta = document.createElement('div');
    meta.className = 'item-meta';
    meta.textContent = item.album || item.date || '';
    info.appendChild(title);
    info.appendChild(meta);
    div.appendChild(info);
    // Klick- und Tastatur-Event
    div.onclick = () => loadItem(item.id);
    div.onkeydown = (e) => { if(e.key === 'Enter') loadItem(item.id); };
    list.appendChild(div);
    // Markierung, wenn ausgewählt
    if (item.id === currentEdit) {
      div.classList.add('active');
      div.focus();
    }
  });
  updateModeLabel();
  saveLocal();  // Automatische Sicherung nach Render
}

// Läd einen Eintrag in die Formular-Felder
function loadItem(id) {
  const arr = mode === 'songs' ? songs : news;
  const item = arr.find(x => x.id === id);
  if (!item) return;
  currentEdit = id;
  title.value = item.title || '';
  albumOrDate.value = item.album || item.date || '';
  extra1.value = item.genre || item.extra || '';
  extra2.value = item.youtube || item.extra2 || '';
  image.value = item.cover || item.image || '';
  text.value = item.lyrics || item.text || '';
  release.value = item.release || '';
  updatePreview();
  render();
}

// Update der Cover-Vorschau
image.addEventListener('input', updatePreview);
function updatePreview() {
  const img = document.getElementById('imgPreview');
  if (image.value) {
    img.src = image.value;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
}

// Speichert oder aktualisiert einen Eintrag
function saveItem() {
  const arr = mode === 'songs' ? songs : news;
  const id = currentEdit || Date.now().toString();
  const item = { id };
  item.title = title.value;
  if (mode === 'songs') {
    item.album = albumOrDate.value;
    item.genre = extra1.value;
    item.youtube = extra2.value;
    item.cover = image.value;
    item.lyrics = text.value;
    item.release = release.value;
  } else {
    item.date = albumOrDate.value;
    item.extra = extra1.value;
    item.extra2 = extra2.value;
    item.image = image.value;
    item.text = text.value;
  }
  const idx = arr.findIndex(x => x.id === id);
  if (idx >= 0) arr[idx] = item;
  else arr.push(item);
  currentEdit = null;
  clearForm();
  render();
}

// Löschen mit Bestätigung und Undo-Option
function deleteItem() {
  const arr = mode === 'songs' ? songs : news;
  if (!currentEdit) return;
  if (!confirm('Wirklich löschen?')) return;
  const idx = arr.findIndex(x => x.id === currentEdit);
  if (idx >= 0) {
    lastDeleted = { item: arr[idx], index: idx, mode };
    arr.splice(idx, 1);
    currentEdit = null;
    clearForm();
    render();
    showUndo();
  }
}
function showUndo() {
  clearTimeout(undoTimeout);
  const snackbar = document.getElementById('undoSnackbar');
  document.getElementById('undoText').textContent = (lastDeleted.mode==='songs'?'Song':'News') + ' gelöscht.';
  snackbar.style.display = 'block';
  undoTimeout = setTimeout(() => {
    snackbar.style.display = 'none';
    lastDeleted = null;
  }, 5000);
}
function undoDelete() {
  if (!lastDeleted) return;
  const arr = lastDeleted.mode === 'songs' ? songs : news;
  arr.splice(lastDeleted.index, 0, lastDeleted.item);
  render();
  lastDeleted = null;
  document.getElementById('undoSnackbar').style.display = 'none';
}

// Formularfelder leeren
function clearForm() {
  title.value = '';
  albumOrDate.value = '';
  extra1.value = '';
  extra2.value = '';
  image.value = '';
  text.value = '';
  document.getElementById('imgPreview').style.display = 'none';
}
</script>

</body>
</html>
