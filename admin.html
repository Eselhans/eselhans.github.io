<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin V9 - Stable Phase 2</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  padding: 20px;
  font-family: Arial;
}

.bar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background: var(--accent-soft);
  color: var(--text);
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:16px;
}

/* ITEM CARDS */
.item {
  padding:10px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid var(--border);
  background: rgba(255,255,255,0.05);
  cursor:pointer;
  transition: 0.2s;
}

.item:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.08);
}

.item.active {
  border: 1px solid var(--accent);
  background: rgba(201,139,79,0.15);
}

/* PREVIEW IMAGE */
.preview-img {
  width:100%;
  border-radius:12px;
  margin-top:10px;
  object-fit:cover;
  max-height:180px;
}

.card {
  border:1px solid var(--border);
  padding:14px;
  border-radius:14px;
  background: rgba(255,255,255,0.05);
}

input, textarea {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
}
</style>

</head>

<body>

<h1>🎛 Admin V9 - Phase 2</h1>

<div class="bar">
  <button onclick="mode='songs'; render()">🎵 Songs</button>
  <button onclick="mode='news'; render()">📰 News</button>

  <button onclick="saveLocal()">💾 Save</button>
  <button onclick="exportSongs()">⬇ Songs Export</button>
  <button onclick="exportNews()">⬇ News Export</button>
</div>

<div class="container">

<!-- LIST -->
<div class="card">
<h2>📦 Content</h2>
<div id="list"></div>
</div>

<!-- EDITOR -->
<div class="card">
<h2>✏ Editor</h2>

<input id="title" placeholder="Title">
<input id="album" placeholder="Album / Date">
<input id="extra1" placeholder="Genre / Extra">
<input id="extra2" placeholder="YouTube / Extra">
<input id="image" placeholder="Cover / Image URL">
<textarea id="text" placeholder="Lyrics / Text"></textarea>

<img id="imgPreview" class="preview-img" style="display:none;">

<button onclick="saveItem()">Save</button>
<button onclick="deleteItem()">Delete</button>
<button onclick="clearForm()">Clear</button>

</div>

</div>

<script>

let mode = "songs";
let songs = [];
let news = [];
let currentEdit = null;

// LOAD
Promise.all([
  fetch("songs.json").then(r => r.json()),
  fetch("news.json").then(r => r.json())
]).then(([s, n]) => {
  songs = s.songs || [];
  news = n.news || [];
  render();
});

// GET DATA
function getData() {
  return mode === "songs" ? songs : news;
}

// RENDER
function render() {

  const list = document.getElementById("list");
  list.innerHTML = "";

  const data = getData();

  data.forEach(item => {

    const div = document.createElement("div");
    div.className = "item" + (item.id === currentEdit ? " active" : "");

    div.innerHTML = `
      <b>${item.title}</b><br>
      <small>${item.album || item.date || ""}</small>
    `;

    div.onclick = () => loadItem(item.id);

    list.appendChild(div);
  });
}

// LOAD ITEM
function loadItem(id) {

  const data = getData();
  const item = data.find(x => x.id === id);

  if(!item) return;

  currentEdit = id;

  title.value = item.title || "";
  album.value = item.album || item.date || "";
  extra1.value = item.genre || "";
  extra2.value = item.youtube || "";
  image.value = item.image || "";
  text.value = item.lyrics || item.text || "";

  updatePreview();
  render();
}

// IMAGE PREVIEW LIVE
image.addEventListener("input", updatePreview);

function updatePreview() {
  const img = document.getElementById("imgPreview");

  if(image.value) {
    img.src = image.value;
    img.style.display = "block";
  } else {
    img.style.display = "none";
  }
}

// SAVE
function saveItem() {

  const data = getData();

  const item = {
    id: currentEdit || Date.now().toString(),
    title: title.value,
    album: album.value,
    genre: extra1.value,
    youtube: extra2.value,
    image: image.value,
    lyrics: text.value
  };

  const index = data.findIndex(x => x.id === item.id);

  if(index >= 0) data[index] = item;
  else data.push(item);

  currentEdit = null;
  clearForm();
  render();
}

// DELETE
function deleteItem() {

  const data = getData();

  if(!currentEdit) return;

  const index = data.findIndex(x => x.id === currentEdit);

  if(index >= 0) data.splice(index, 1);

  currentEdit = null;
  clearForm();
  render();
}

// CLEAR
function clearForm() {
  title.value = "";
  album.value = "";
  extra1.value = "";
  extra2.value = "";
  image.value = "";
  text.value = "";
  document.getElementById("imgPreview").style.display = "none";
}

// SAVE LOCAL
function saveLocal() {
  localStorage.setItem("cms_phase2", JSON.stringify({ songs, news }));
}

// EXPORT
function exportSongs() {
  const blob = new Blob(
    [JSON.stringify({ songs }, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "songs.json";
  a.click();
}

function exportNews() {
  const blob = new Blob(
    [JSON.stringify({ news }, null, 2)],
    { type: "application/json" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "news.json";
  a.click();
}

</script>

</body>
</html>
