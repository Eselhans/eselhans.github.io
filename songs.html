<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eselhans | Songs</title>

<link rel="stylesheet" href="style.css">

<style>
.song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.song-card {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
}

.song-card:hover {
  transform: translateY(-4px);
  background: rgba(255,255,255,0.08);
}

.song-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.song-content {
  padding: 14px;
}

.song-title {
  font-weight: bold;
  font-size: 1.1rem;
}

.song-meta {
  color: var(--muted);
  font-size: 0.9rem;
  margin: 6px 0;
}

.lyrics {
  display: none;
  margin-top: 10px;
  color: var(--muted);
  white-space: pre-line;
}

.song-card.active .lyrics {
  display: block;
}

.button-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<main class="page">

<nav class="topbar">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="bilder/logo-eselhans.png">
    Eselhans
  </a>

  <div class="nav-links">
    <a href="songs.html">Songs</a>
    <a href="videos.html">Videos</a>
    <a href="news.html">News</a>
  </div>
</nav>

<header class="hero">
  <span class="eyebrow">Musik Universe</span>
  <h1>Songs</h1>
  <p class="lead">Alle Songs, Lyrics, Videos & Infos an einem Ort.</p>
</header>

<section class="song-grid" id="songGrid"></section>

</main>

<script>
fetch("songs.json")
  .then(r => r.json())
  .then(data => {

    const grid = document.getElementById("songGrid");

    data.songs.forEach(song => {

      const card = document.createElement("div");
      card.className = "song-card";

      card.innerHTML = `
        <img src="${song.cover || 'bilder/cover-platzhalter.png'}">

        <div class="song-content">
          <div class="song-title">${song.title}</div>
          <div class="song-meta">
            ${song.album || ""} • ${song.genre || ""} • ${song.release || ""}
          </div>

          <div class="button-row">
            <a href="${song.youtube}" target="_blank">YouTube</a>
            <button onclick="this.parentElement.parentElement.parentElement.classList.toggle('active')">
              Lyrics
            </button>
          </div>

          <div class="lyrics">${song.lyrics || "Keine Lyrics vorhanden"}</div>
        </div>
      `;

      grid.appendChild(card);
    });

  });
</script>

</body>
</html>
